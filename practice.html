<!DOCTYPE html>

<html lang = "en">

<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <title> JS Practice </title>

</head>

    <body>
            <div id = "colorBox"> Hello! I will change color</div>
            <button onclick = "changeColor()">change color</button>

            <h1 id = "counter">0</h1>
            <button onclick = "increaseCounter()"> Click Me </button>

            <h1 id = "text"> Text Box </h1>
            <button onclick = "textFlashing()"> Click Me   </button>

            <h1 id = "flash"> flash box </h1>
            <button onclick = "flashBox()"> click me</button>

        
           <h2> To Do List </h2>
            <input type = "text" id = "todoinput" placeholder = "Enter to do items">
            <button onclick = "addTodo()"> Add Todo </button>
            <ul id = "todoList"> </ul>


           <input type = "color" id = "colorPicker">


            <h2> Form Validation </h2>

            <input type = "text" id = "name" placeholder = "Enter name">
            <p id = "nameError" style = "color:red">  </p>

            <input type = "email" id = "email" placeholder = "Enter email">
            <p id = "emailError" style = "color:red">  </p>

            <input type = "password" id = "password" placeholder = "Enter password">
            <p  id = "passwordError" style = "color:red">   </p>

            <button onclick = "validateForm()"> Submit </button> 
             
            
            <h2>Calculator</h2>

            <input type="number" id="num1" placeholder = "Enter first number">
            <input type="number" id="num2" placeholder = "Enter second number">

            <button onclick ="calculate('+')">Add</button>
            <button onclick ="calculate('-')">Subtract</button>
            <button onclick ="calculate('*')">Multiply</button>
            <button onclick ="calculate('/')">Divide</button>

            <p id = "result"> </p>


            <h2>Price List with 10% Discount </h2> 
                <ul id="PriceList"> </ul>


                // Student Fiter App

            <h2> Student Filter </h2>
            <div id = "studentList"> </div>

            <button onclick = "filterStudents()"> Show Above 60 </button>
            <button onclick = "showStudents(students)"> Show All </button>

                    

                // fetch()
            <h2> Fetch Practice </h2>
            <div id = "fetchResult"> </div>

           




        <script>

            let colors = ["red", "blue", "green", "yellow", "orange"];
            let count = 0;

          function changeColor()    {
            document.getElementById("colorBox").style.backgroundColor = colors[count];
            count++;
            if(count > colors.length-1) {
                count = 0;
            }
                  }

            function increaseCounter()   {
                let counter = document.getElementById("counter");
                let currentValue = parseInt(counter.innerText);
                counter.innerText = currentValue + 1;
            }

            function textFlashing() {
                let text = document.getElementById("text");
                text.style.color = "red";
                setTimeout(() => {
                    text.style.color = "black";
                }, 1000);
            }

            function flashBox() {
                if( count%2 ==0)   {
                    document.getElementById("flash").style.visibility = "hidden";
                }    else     {
                    document.getElementById("flash").style.visibility = "visible";
                }   
                    count++;
                }
                
            function addTodo()  {
            let task = document.getElementById("todoinput").value;
            let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
            tasks.push(task);
            localStorage.setItem("tasks", JSON.stringify(tasks));    
            let li = document.createElement("li");
            li.innerText = task;
            document.getElementById("todoList").appendChild(li);
            document.getElementById("todoinput").value = "";
            }

            function loadTasks()  {
                let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

                tasks.forEach(task => {
                    let li = document.createElement("li");
                    li.innerText = task;
                    document.getElementById("todoList").appendChild(li);
                });

            }
                    window.onload = loadTasks;

           


      document.getElementById("colorPicker").addEventListener("input", function() { document.body.style.backgroundColor = this.value; });
        
   

             function	validateForm()		{

            let name = document.getElementById("name").value;
            if( name == null || name == "")	{
            document.getElementById("nameError").innerText = "Name is required";
            }   else    {
                document.getElementById("nameError").innerText="";
            }

            let email = document.getElementById("email").value;
            if(email==null || email =="")	{
            document.getElementById("emailError").innerText="email is required";
            }   else      {
                document.getElementById("emailError").innerText="";
            }

            let password = document.getElementById("password").value;
            if(password==null||password==""|| password.length<6)	{
            document.getElementById("passwordError").innerText="password is required";
            }   else    {
               document.getElementById("passwordError").innerText="";
                }
            }

            function calculate(operator)  {
                    let num1 = parseFloat(document.getElementById("num1").value);
                    let num2 = parseFloat(document.getElementById("num2").value);
                    let result;

                if(operator =='+') {
                    result = num1+num2;
                   
                    }   else if(operator =='-')   {
                        result = num1-num2;
                       
                    }   else if(operator =='*')  {
                        result = num1*num2;
                        
                    }   else if(operator =='/')  {
                        result = num1/num2;
                       
                    } 

                     document.getElementById("result").innerText = "result: " +result;
            }

            // Practice Map()

            let numbers = [1,2,3,4,5];
            let doubled = numbers.map(num => num*2);
            console.log(doubled);

            // Try with strings !
                let names = ["ashu", "rahul", "priya"];
                let upperNames = names.map(name => name.toUpperCase());
                console.log(upperNames);

               
            //  Price Discount Calculator

            let prices = [100,200,300,400,500];
            let discounted = prices.map( price => price*0.9);

            discounted.map( price => { 
                let li = document.createElement("li");
                li.innerText = "Rs. " + price;
                document.getElementById("PriceList").appendChild(li);
            });


            // Practice Filter()

            let nu = [1,2,3,4,5];
            let evenNumbers = nu.filter(num => num%2 == 0);
            console.log(evenNumbers);

            let name = ["ashu", "rahul", "priya", "anil", "sita"];
            let starts = name.filter(name => name.startsWith("a"));
            let nameWithA = name.filter(name => name.includes("a"));
            console.log(nameWithA);
            console.log(starts);

            let rate = [100,200,300,400,500];
            let expensive = rate.filter(price => price > 300);
            console.log(expensive);


            // Student Filter App

            let students = [
                {name: "Ashu", marks: 85},
                {name: "Rahul", marks: 78},
                {name: "Priya", marks: 92},
                {name: "Anil", marks: 65},
                {name: "Sita", marks: 55},
                {name: "Ravi", marks: 80}
            ];

            function showStudents(arr)  {
                let div = document.getElementById("studentList");
                div.innerHTML = "";
                arr.forEach(student => {
                    div.innerHTML += `<p>  ${student.name} - ${student.marks} </p>`;
                });
            }
                    showStudents(students);
       
                function filterStudents()   {
                    let passed = students.filter( student => student.marks > 60);
                    showStudents(passed);

                }

                // fetch()

                fetch("https://jsonplaceholder.typicode.com/users/1")
                .then(response => response.json())
                .then(data => {
                    console.log(data);
                });

                
                fetch("https://jsonplaceholder.typicode.com/users")
                .then(response => response.json())
                .then(data => {
                   let div = document.getElementById("fetchResult");
                   div.innerHTML = "";
                    data.forEach(user => {
                        div.innerHTML += `<p> ${user.name} - ${user.email} </p>`;
                    })
                });



                

            


        </script>

    </body>

</html>
